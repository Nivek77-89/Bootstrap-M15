<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulari de contacte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-lg-4 col-md-6 col-sm-12 mb-4">
                <form id="formulari" onsubmit="cridaSubmit(event)" novalidate>
                    <div class="mb-3">
                        <label for="nom" class="form-label">Nom</label>
                        <input type="text" class="form-control" id="nom" name="nom" required>
                    </div>
                    <div class="mb-3">
                        <label for="cognoms" class="form-label">Cognoms</label>
                        <input type="text" class="form-control" id="cognoms" name="cognoms" required>
                    </div>
                    <div class="mb-3">
                        <label for="naixement" class="form-label">Data de naixement</label>
                        <input type="date" class="form-control" id="naixement" name="naixement" required>
                    </div>
                    <div class="mb-3">
                        <label for="correu" class="form-label">Correu electrònic</label>
                        <input type="text" class="form-control" id="correu" name="correu" placeholder="nom@exemple.com" required>
                        <div class="invalid-feedback">El format del correu electrònic no és correcte.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label d-block">Gènere</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="genere" id="genereHome" value="home" required>
                            <label class="form-check-label" for="genereHome">Home</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="genere" id="genereDona" value="dona">
                            <label class="form-check-label" for="genereDona">Dona</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="genere" id="genereNoDefinit" value="no-definit">
                            <label class="form-check-label" for="genereNoDefinit">No definit</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="tipus" class="form-label">Tipus d'informació</label>
                        <select class="form-select" id="tipus" name="tipus" required>
                            <option value="" selected disabled>Selecciona el tipus d'informació</option>
                            <option value="general">Informació general</option>
                            <option value="tecnica">Informació tècnica</option>
                            <option value="comercial">Informació comercial</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="comentaris" class="form-label">Comentaris</label>
                        <textarea class="form-control" id="comentaris" name="comentaris" rows="3" placeholder="Escriu aquí..." required></textarea>
                    </div>

                    <div class="text-end">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>

                <a href="/html/index.html" class="btn btn-secondary mt-2">Tornar a la pàgina principal</a>
            </div>
        </div>
    </div>

    <script>
        function correuValid(correu) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
            return regex.test(correu);
        }

        function cridaSubmit(event) {
            event.preventDefault();

            const formulari = document.getElementById("formulari");
            const correu = formulari.elements["correu"];

            // Comprova que tots els camps required estiguin plens
            if (!formulari.checkValidity()) {
                formulari.reportValidity();
                return;
            }

            // Comprova el format del correu abans d'enviar
            if (!correuValid(correu.value.trim())) {
                correu.classList.add("is-invalid");
                correu.focus();
                return;
            }
            correu.classList.remove("is-invalid");

            const nom = formulari.elements["nom"].value;
            alert("Hola " + nom);
        }
    </script>
</body>
</html>
